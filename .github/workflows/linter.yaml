name: Check code issues
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'main'
jobs:
  commitlint:
    uses: zeitonline/gh-action-workflows/.github/workflows/commit-lint.yaml@7c0cccffb89e545f3c37312433c7810432107003 # 4.7.3
  linter:
    uses: zeitonline/gh-action-workflows/.github/workflows/lefthook.yaml@7c0cccffb89e545f3c37312433c7810432107003 # 4.7.3
    with:
      node-version: "lts/*"
      setup-command: |
        uv tool install lefthook
        cd frontend/
        npm install
