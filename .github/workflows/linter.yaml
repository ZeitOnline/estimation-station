name: Check code issues
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'main'
jobs:
  commitlint:
    uses: zeitonline/gh-action-workflows/.github/workflows/commit-lint.yaml@288ab646a50fe77f7cf19c3bcd209543fed46982 # 4.9.0
  linter:
    uses: zeitonline/gh-action-workflows/.github/workflows/lefthook.yaml@288ab646a50fe77f7cf19c3bcd209543fed46982 # 4.9.0
    with:
      node-version: "lts/*"
      setup-command: |
        uv tool install lefthook
        cd frontend/
        npm install
