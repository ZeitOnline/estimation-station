name: Check code issues
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'main'
jobs:
  commitlint:
    uses: zeitonline/gh-action-workflows/.github/workflows/commit-lint.yaml@7767d0d1e24ac7942c2e67ae88a5689b0298049f # 4.7.2
  linter:
    uses: zeitonline/gh-action-workflows/.github/workflows/lefthook.yaml@7767d0d1e24ac7942c2e67ae88a5689b0298049f # 4.7.2
    with:
      node-version: "lts/*"
      setup-command: |
        uv tool install lefthook
        cd frontend/
        npm install
