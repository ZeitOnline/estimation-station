name: Check code issues
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'main'
jobs:
  commitlint:
    uses: zeitonline/gh-action-workflows/.github/workflows/commit-lint.yaml@6e29b53abe92baa48d4e00ca560d27f59991e8d3 # 4.10.2
  linter:
    uses: zeitonline/gh-action-workflows/.github/workflows/lefthook.yaml@6e29b53abe92baa48d4e00ca560d27f59991e8d3 # 4.10.2
    with:
      node-version: "lts/*"
      setup-command: |
        uv tool install lefthook
        cd frontend/
        npm install
