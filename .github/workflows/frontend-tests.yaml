---
name: Test frontend
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'main'
    paths:
      - '.github/workflows/frontend-tests.yaml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'frontend/**'
      - 'testing.yaml'
jobs:
  build:
    uses: zeitonline/gh-action-workflows/.github/workflows/build-test-push.yaml@288ab646a50fe77f7cf19c3bcd209543fed46982 # 4.9.0
    with:
      service: frontend
      artifacts: build
