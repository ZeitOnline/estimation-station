---
name: Test frontend
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'main'
    paths:
      - '.github/workflows/frontend-tests.yaml'
      - '.dockerignore'
      - 'Dockerfile'
      - 'frontend/**'
      - 'testing.yaml'
jobs:
  build:
    uses: zeitonline/gh-action-workflows/.github/workflows/build-test-push.yaml@7c0cccffb89e545f3c37312433c7810432107003 # 4.7.3
    with:
      service: frontend
      artifacts: build
