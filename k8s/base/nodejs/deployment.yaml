---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs
  labels:
    app: nodejs
spec:
  selector:
    matchLabels:
      app: nodejs
  template:
    metadata:
      labels:
        app: nodejs
    spec:
      serviceAccountName: baseproject
      containers:
        - name: nodejs
          image: nodejs
          env:
            # Placeholder — overwritten with the deployed image tag by the
            # `replacements` in the overlay kustomization. Read at runtime by
            # the app ($env/dynamic/public), so promoting an image by re-tagging
            # (without a rebuild) still shows the right version.
            - name: PUBLIC_APP_VERSION
              value: unknown
            # Server-side token verification for the WebSocket and the Jira
            # write route — without this the app fails closed (see
            # src/routes/api/jira/story-points/+server.ts).
            - name: AUTH_MODE
              value: oidc
            - name: ALLOWED_EMAIL_DOMAINS
              value: zeit.de
            # ENG keeps the ticket text in "Beschreibung ENG-Task" rather than
            # the system description — without this the preview shows only
            # the title.
            - name: JIRA_DESCRIPTION_FIELDS
              value: customfield_11371,description
            # The tickets a room can pick from (searchable, one checkbox per
            # status). Those in the default statuses are what the moderator
            # steps through with the arrow keys; the first one is shown by
            # default.
            - name: JIRA_BACKLOG_JQL
              value: project = ENG AND status in ("Waiting for Ref", Backlog) AND issuetype != Epic ORDER BY Rank ASC
            - name: JIRA_BACKLOG_DEFAULT_STATUSES
              value: Waiting for Ref
          resources:
            requests:
              cpu: "0.2"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          envFrom:
            - secretRef:
                name: jira-secrets
