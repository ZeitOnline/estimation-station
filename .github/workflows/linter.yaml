name: Check code issues
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'main'
jobs:
  commitlint:
    uses: zeitonline/gh-action-workflows/.github/workflows/commit-lint.yaml@f9996e6319d9fe72056ba3eb2d1378748c479f64 # 4.7.0
  linter:
    uses: zeitonline/gh-action-workflows/.github/workflows/lefthook.yaml@f9996e6319d9fe72056ba3eb2d1378748c479f64 # 4.7.0
    with:
      node-version: "lts/*"
      setup-command: |
        uv tool install lefthook
        cd frontend/
        npm install
