name: Check code issues
on:
  workflow_dispatch:
  push:
    branches-ignore:
      - 'main'
jobs:
  commitlint:
    uses: zeitonline/gh-action-workflows/.github/workflows/commit-lint.yaml@b19340fe2799d806acba988c59a2213eb3771971 # 4.10.1
  linter:
    uses: zeitonline/gh-action-workflows/.github/workflows/lefthook.yaml@b19340fe2799d806acba988c59a2213eb3771971 # 4.10.1
    with:
      node-version: "lts/*"
      setup-command: |
        uv tool install lefthook
        cd frontend/
        npm install
